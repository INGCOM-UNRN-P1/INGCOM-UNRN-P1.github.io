<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f8f9fa; }
      .box { fill: #ffffff; stroke: #192437; stroke-width: 2; rx: 4px; }
      .box-active { fill: #fff3f3; stroke: #eb2141; stroke-width: 2; rx: 4px; }
      .title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #192437; text-anchor: middle; }
      .subtitle { font-family: 'Lato', Arial, sans-serif; font-size: 12px; fill: #555555; text-anchor: middle; }
      .label-text { font-family: 'Share Tech Mono', monospace; font-size: 13px; fill: #192437; }
      .label-bold { font-family: 'Lato', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #192437; }
      .arrow { stroke: #eb2141; stroke-width: 1.5; fill: none; }
      .arrow-up { stroke: #192437; stroke-width: 1.5; fill: none; }
      .arrow-text { font-family: 'Lato', Arial, sans-serif; font-size: 10px; fill: #eb2141; font-weight: bold; }
      .arrow-text-up { font-family: 'Lato', Arial, sans-serif; font-size: 10px; fill: #192437; font-weight: bold; }
      .step-title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #192437; text-anchor: middle; }
    </style>
    <!-- Flechas -->
    <marker id="arrowhead-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb2141"/>
    </marker>
    <marker id="arrowhead-dark" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#192437"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Título principal -->
  <text x="350" y="30" class="title">Evolución de la Pila de Llamadas (Call Stack) para factorial(3)</text>
  <text x="350" y="48" class="subtitle">Visualización paso a paso de la asignación y liberación de marcos de pila (Stack Frames)</text>

  <!-- PASO 1: APILAMIENTO -->
  <!-- Columna 1: Crecimiento -->
  <text x="175" y="90" class="step-title">1. Fase de Apilamiento (Crecimiento)</text>
  
  <!-- Marco factorial(0) -->
  <rect x="50" y="110" width="250" height="50" class="box-active"/>
  <text x="65" y="130" class="label-bold">factorial(0)</text>
  <text x="65" y="145" class="label-text">n = 0   [Caso Base -> retorna 1]</text>

  <!-- Marco factorial(1) -->
  <rect x="50" y="170" width="250" height="50" class="box"/>
  <text x="65" y="190" class="label-bold">factorial(1)</text>
  <text x="65" y="205" class="label-text">n = 1   [Espera retorno de factorial(0)]</text>

  <!-- Marco factorial(2) -->
  <rect x="50" y="230" width="250" height="50" class="box"/>
  <text x="65" y="250" class="label-bold">factorial(2)</text>
  <text x="65" y="265" class="label-text">n = 2   [Espera retorno de factorial(1)]</text>

  <!-- Marco factorial(3) -->
  <rect x="50" y="290" width="250" height="50" class="box"/>
  <text x="65" y="310" class="label-bold">factorial(3)</text>
  <text x="65" y="325" class="label-text">n = 3   [Espera retorno de factorial(2)]</text>

  <!-- Flechas de llamadas -->
  <path d="M 315,315 C 330,315 330,255 315,255" class="arrow-up" marker-end="url(#arrowhead-dark)"/>
  <text x="330" y="290" class="arrow-text-up">Llama</text>

  <path d="M 315,255 C 330,255 330,195 315,195" class="arrow-up" marker-end="url(#arrowhead-dark)"/>
  <text x="330" y="230" class="arrow-text-up">Llama</text>

  <path d="M 315,195 C 330,195 330,135 315,135" class="arrow-up" marker-end="url(#arrowhead-dark)"/>
  <text x="330" y="170" class="arrow-text-up">Llama</text>

  <!-- PASO 2: DESAPILAMIENTO -->
  <!-- Columna 2: Resolución -->
  <text x="525" y="90" class="step-title">2. Fase de Desapilamiento (Resolución)</text>

  <!-- Marco factorial(0) - liberándose -->
  <rect x="400" y="110" width="250" height="50" class="box" style="stroke-dasharray: 4 4; opacity: 0.5;"/>
  <text x="415" y="130" class="label-bold" style="opacity: 0.5;">factorial(0)</text>
  <text x="415" y="145" class="label-text" style="opacity: 0.5;">n = 0   [Retornó 1 y se liberó]</text>

  <!-- Marco factorial(1) -->
  <rect x="400" y="170" width="250" height="50" class="box-active"/>
  <text x="415" y="190" class="label-bold">factorial(1)</text>
  <text x="415" y="205" class="label-text">Calcula: 1 * (Retorno: 1) = 1</text>

  <!-- Marco factorial(2) -->
  <rect x="400" y="230" width="250" height="50" class="box"/>
  <text x="415" y="250" class="label-bold">factorial(2)</text>
  <text x="415" y="265" class="label-text">Calcula: 2 * (Retorno: 1) = 2</text>

  <!-- Marco factorial(3) -->
  <rect x="400" y="290" width="250" height="50" class="box"/>
  <text x="415" y="310" class="label-bold">factorial(3)</text>
  <text x="415" y="325" class="label-text">Calcula: 3 * (Retorno: 2) = 6</text>

  <!-- Flechas de retornos -->
  <path d="M 390,135 C 375,135 375,195 390,195" class="arrow" marker-end="url(#arrowhead-red)"/>
  <text x="350" y="170" class="arrow-text" style="text-anchor: end;">Retorna 1</text>

  <path d="M 390,195 C 375,195 375,255 390,255" class="arrow" marker-end="url(#arrowhead-red)"/>
  <text x="350" y="230" class="arrow-text" style="text-anchor: end;">Retorna 1</text>

  <path d="M 390,255 C 375,255 375,315 390,315" class="arrow" marker-end="url(#arrowhead-red)"/>
  <text x="350" y="290" class="arrow-text" style="text-anchor: end;">Retorna 2</text>

  <!-- Indicador del Heap/Stack -->
  <line x1="350" y1="90" x2="350" y2="360" stroke="#cccccc" stroke-width="1" stroke-dasharray="2 2"/>
  
  <text x="350" y="380" class="label-bold" style="text-anchor: middle; fill: #eb2141;">Resultado Final: 6</text>
</svg>
