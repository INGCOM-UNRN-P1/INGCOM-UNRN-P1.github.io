<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="650" height="420" viewBox="0 0 650 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #192437; text-anchor: middle; }
      .subtitle { font-family: 'Lato', Arial, sans-serif; font-size: 13px; fill: #555; text-anchor: middle; }
      .frame-main { fill: #f8f9fa; stroke: #192437; stroke-width: 1.5; rx: 4; }
      .frame-func { fill: #fff0f2; stroke: #eb2141; stroke-width: 1.5; rx: 4; }
      .cell-array { fill: #e2eafc; stroke: #192437; stroke-width: 1.5; }
      .label-title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #192437; }
      .label-title-func { font-family: 'Fabrikat', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #eb2141; }
      .label-text { font-family: 'Lato', Arial, sans-serif; font-size: 11px; fill: #333; }
      .text-code { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #192437; }
      .mem-addr { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #666; }
      .arrow { fill: none; stroke: #eb2141; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-dashed { fill: none; stroke: #192437; stroke-width: 1.2; stroke-dasharray: 3,3; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb2141"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#192437"/>
    </marker>
  </defs>

  <!-- Fondo Blanco -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Títulos -->
  <text x="325" y="30" class="title">Decaimiento de Arreglo a Puntero (Decay)</text>
  <text x="325" y="50" class="subtitle">Pasaje físico de arreglos en el Stack Frame de llamadas</text>

  <!-- STACK FRAME 1: main() -->
  <g transform="translate(50, 80)">
    <rect width="240" height="280" class="frame-main" />
    <text x="15" y="25" class="label-title">Stack Frame: main()</text>
    
    <!-- Código local -->
    <text x="15" y="50" class="text-code">int arr[3] = {10, 20, 30};</text>
    <text x="15" y="65" class="text-code">mostrar(arr, 3);</text>

    <!-- Representación del Arreglo -->
    <text x="15" y="105" class="label-title">Arreglo arr en memoria</text>
    
    <!-- Celdas del arreglo -->
    <!-- Celda 0 -->
    <rect x="15" y="120" width="140" height="40" class="cell-array" />
    <text x="25" y="145" class="text-code">arr[0] = 10</text>
    <text x="165" y="145" class="mem-addr">0x7FFEE100</text>

    <!-- Celda 1 -->
    <rect x="15" y="160" width="140" height="40" class="cell-array" />
    <text x="25" y="185" class="text-code">arr[1] = 20</text>
    <text x="165" y="185" class="mem-addr">0x7FFEE104</text>

    <!-- Celda 2 -->
    <rect x="15" y="200" width="140" height="40" class="cell-array" />
    <text x="25" y="225" class="text-code">arr[2] = 30</text>
    <text x="165" y="225" class="mem-addr">0x7FFEE108</text>

    <text x="15" y="260" class="label-text">El nombre 'arr' decae al puntero</text>
    <text x="15" y="272" class="text-code" fill="#eb2141">&amp;arr[0] (0x7FFEE100)</text>
  </g>

  <!-- STACK FRAME 2: mostrar() -->
  <g transform="translate(360, 80)">
    <rect width="240" height="280" class="frame-func" />
    <text x="15" y="25" class="label-title-func">Stack Frame: mostrar()</text>
    
    <text x="15" y="50" class="text-code">void mostrar(int *ptr, int tam)</text>

    <!-- Variables locales en stack de mostrar -->
    <!-- Puntero ptr -->
    <rect x="15" y="120" width="150" height="40" fill="#fff" stroke="#eb2141" stroke-width="1.5" rx="3" />
    <text x="25" y="145" class="text-code">ptr = 0x7FFEE100</text>
    <text x="175" y="145" class="mem-addr">0x7FFEE080</text>
    <text x="15" y="110" class="label-text">Parámetro ptr (Puntero copiado):</text>

    <!-- Parámetro tam -->
    <rect x="15" y="200" width="150" height="40" fill="#fff" stroke="#192437" stroke-width="1" rx="3" />
    <text x="25" y="225" class="text-code">tam = 3</text>
    <text x="175" y="225" class="mem-addr">0x7FFEE088</text>
    <text x="15" y="190" class="label-text">Parámetro tam (Copia de tamaño):</text>
    
    <text x="15" y="265" class="label-text">Copia por valor del puntero.</text>
  </g>

  <!-- Flechas de Indirección -->
  <!-- Copia de arr a ptr -->
  <path d="M 115,160 C 115,30 330,30 375,120" class="arrow-dashed" />
  <text x="240" y="45" font-family="Lato" font-size="10" fill="#192437" text-anchor="middle">Copia dirección base de arr</text>

  <!-- Puntero ptr apuntando al arreglo original -->
  <path d="M 375,140 L 215,140" class="arrow" />
  <text x="280" y="132" font-family="Lato" font-size="10" fill="#eb2141" text-anchor="middle">Apunta a arr[0]</text>

</svg>
