<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f8f9fa; }
      .box { fill: #ffffff; stroke: #192437; stroke-width: 2; rx: 4px; }
      .box-single { fill: #fff3f3; stroke: #eb2141; stroke-width: 2; rx: 4px; }
      .box-sorted { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 4px; }
      .title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #192437; text-anchor: middle; }
      .label-text { font-family: 'Share Tech Mono', monospace; font-size: 13px; font-weight: bold; fill: #192437; text-anchor: middle; }
      .phase-title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #555555; }
      .arrow { stroke: #192437; stroke-width: 1.5; fill: none; }
      .arrow-merge { stroke: #2e7d32; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#192437"/>
    </marker>
    <marker id="arrowhead-merge" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- FASE DIVIDIR -->
  <text x="30" y="45" class="phase-title">1. DIVIDIR</text>
  
  <!-- Nivel 0 -->
  <rect x="230" y="30" width="140" height="30" class="box"/>
  <text x="300" y="50" class="label-text">[12, 11, 13, 5]</text>

  <!-- Flechas nivel 0 -> 1 -->
  <path d="M 280,60 L 190,95" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 320,60 L 410,95" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Nivel 1 -->
  <rect x="130" y="95" width="90" height="30" class="box"/>
  <text x="175" y="115" class="label-text">[12, 11]</text>

  <rect x="380" y="95" width="90" height="30" class="box"/>
  <text x="425" y="115" class="label-text">[13, 5]</text>

  <!-- Flechas nivel 1 -> 2 -->
  <path d="M 160,125 L 105,160" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 190,125 L 245,160" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 410,125 L 355,160" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 440,125 L 495,160" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Nivel 2: Caso base -->
  <rect x="80" y="160" width="50" height="30" class="box-single"/>
  <text x="105" y="180" class="label-text">[12]</text>

  <rect x="220" y="160" width="50" height="30" class="box-single"/>
  <text x="245" y="180" class="label-text">[11]</text>

  <rect x="330" y="160" width="50" height="30" class="box-single"/>
  <text x="355" y="180" class="label-text">[13]</text>

  <rect x="470" y="160" width="50" height="30" class="box-single"/>
  <text x="495" y="180" class="label-text">[5]</text>

  <!-- FASE COMBINAR -->
  <text x="30" y="240" class="phase-title">2. COMBINAR (Fusión)</text>

  <!-- Flechas nivel 2 -> 3 -->
  <path d="M 105,190 L 160,225" class="arrow-merge" marker-end="url(#arrowhead-merge)"/>
  <path d="M 245,190 L 190,225" class="arrow-merge" marker-end="url(#arrowhead-merge)"/>
  <path d="M 355,190 L 410,225" class="arrow-merge" marker-end="url(#arrowhead-merge)"/>
  <path d="M 495,190 L 440,225" class="arrow-merge" marker-end="url(#arrowhead-merge)"/>

  <!-- Nivel 3 -->
  <rect x="130" y="225" width="90" height="30" class="box-sorted"/>
  <text x="175" y="245" class="label-text">[11, 12]</text>

  <rect x="380" y="225" width="90" height="30" class="box-sorted"/>
  <text x="425" y="245" class="label-text">[5, 13]</text>

  <!-- Flechas nivel 3 -> 4 -->
  <path d="M 175,255 L 265,290" class="arrow-merge" marker-end="url(#arrowhead-merge)"/>
  <path d="M 425,255 L 335,290" class="arrow-merge" marker-end="url(#arrowhead-merge)"/>

  <!-- Nivel 4 (Resultado Final) -->
  <rect x="230" y="290" width="140" height="30" class="box-sorted"/>
  <text x="300" y="310" class="label-text">[5, 11, 12, 13]</text>
  
  <text x="300" y="350" class="title" style="fill: #2e7d32;">Arreglo Ordenado</text>
</svg>
