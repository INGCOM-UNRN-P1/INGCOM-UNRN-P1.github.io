<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="650" height="500" viewBox="0 0 650 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Estilos específicos según directivas de GEMINI.md -->
    <style>
      .title { font-family: 'Fabrikat', 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #192437; text-anchor: middle; }
      .subtitle { font-family: 'Lato', Arial, sans-serif; font-size: 13px; fill: #555; text-anchor: middle; }
      .frame-border { fill: #f8f9fa; stroke: #192437; stroke-width: 2; rx: 6; }
      .frame-border-active { fill: #fff0f2; stroke: #eb2141; stroke-width: 2.5; rx: 6; }
      .label-title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #192437; }
      .label-title-active { font-family: 'Fabrikat', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #eb2141; }
      .label-text { font-family: 'Lato', Arial, sans-serif; font-size: 12px; fill: #333; }
      .code-text { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 12px; fill: #192437; }
      .mem-addr { font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 12px; fill: #666; text-anchor: end; }
      .arrow { fill: none; stroke: #eb2141; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-blue { fill: none; stroke: #192437; stroke-width: 1.5; stroke-dasharray: 4,4; marker-end: url(#arrowhead-blue); }
    </style>
    <!-- Marcadores de Flecha -->
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb2141"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#192437"/>
    </marker>
  </defs>

  <!-- Fondo Blanco General -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Título principal del diagrama -->
  <text x="325" y="35" class="title">Marcos de Ejecución en el Stack (Recursión de Factorial)</text>
  <text x="325" y="55" class="subtitle">Estado físico de la pila al evaluar factorial(3) hasta llegar al caso base</text>

  <!-- Eje del Stack / Crecimiento -->
  <line x1="120" y1="100" x2="120" y2="420" stroke="#ccc" stroke-width="2" />
  <!-- Flecha de crecimiento del stack -->
  <path d="M 120,400 L 120,120" fill="none" stroke="#eb2141" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="105" y="260" font-family="Lato" font-size="11" fill="#eb2141" transform="rotate(-90 105 260)" text-anchor="middle">Crecimiento de la Pila (Direcciones menores)</text>

  <!-- FRAME 3: factorial(1) - CASO BASE (Activo) -->
  <g transform="translate(150, 95)">
    <rect width="360" height="90" class="frame-border-active" />
    <text x="375" y="45" class="mem-addr">0x7FFF0800</text>
    <text x="15" y="22" class="label-title-active">Marco: factorial(1) (Caso Base - Activo)</text>
    <text x="15" y="42" class="label-text">Parámetro: <tspan class="code-text">n = 1</tspan></text>
    <text x="15" y="60" class="label-text">Dirección de Retorno: <tspan class="code-text">0x00401A24</tspan> (dentro de factorial(2))</text>
    <text x="15" y="78" class="label-text">Valor de retorno inmediato: <tspan class="code-text">1</tspan></text>
  </g>

  <!-- FRAME 2: factorial(2) -->
  <g transform="translate(150, 200)">
    <rect width="360" height="90" class="frame-border" />
    <text x="375" y="45" class="mem-addr">0x7FFF0860</text>
    <text x="15" y="22" class="label-title">Marco: factorial(2) (Suspendido)</text>
    <text x="15" y="42" class="label-text">Parámetro: <tspan class="code-text">n = 2</tspan></text>
    <text x="15" y="60" class="label-text">Dirección de Retorno: <tspan class="code-text">0x00401A24</tspan> (dentro de factorial(3))</text>
    <text x="15" y="78" class="label-text">Evaluación: <tspan class="code-text">2 * factorial(1)</tspan> (esperando valor)</text>
  </g>

  <!-- FRAME 1: factorial(3) -->
  <g transform="translate(150, 305)">
    <rect width="360" height="90" class="frame-border" />
    <text x="375" y="45" class="mem-addr">0x7FFF08C0</text>
    <text x="15" y="22" class="label-title">Marco: factorial(3) (Suspendido)</text>
    <text x="15" y="42" class="label-text">Parámetro: <tspan class="code-text">n = 3</tspan></text>
    <text x="15" y="60" class="label-text">Dirección de Retorno: <tspan class="code-text">0x004011B0</tspan> (función main)</text>
    <text x="15" y="78" class="label-text">Evaluación: <tspan class="code-text">3 * factorial(2)</tspan> (esperando valor)</text>
  </g>

  <!-- Flechas de flujo de retorno de los marcos -->
  <!-- De frame 1 a frame 2 -->
  <path d="M 525,185 Q 560,210 525,235" class="arrow" />
  <text x="560" y="215" font-family="Lato" font-size="11" fill="#eb2141" text-anchor="start">retorna 1</text>

  <!-- De frame 2 a frame 3 -->
  <path d="M 525,290 Q 560,315 525,340" class="arrow" />
  <text x="560" y="320" font-family="Lato" font-size="11" fill="#eb2141" text-anchor="start">retorna 2</text>

  <!-- Leyenda informativa -->
  <rect x="150" y="415" width="360" height="50" fill="#f1f3f5" stroke="#ced4da" rx="4" />
  <text x="165" y="435" font-family="Lato" font-size="11" fill="#495057">
    Cada llamada recursiva añade un nuevo frame al Stack. Si no existiera
  </text>
  <text x="165" y="450" font-family="Lato" font-size="11" fill="#495057">
    un caso base de corte, la pila consumiría toda la memoria física (Stack Overflow).
  </text>

</svg>
