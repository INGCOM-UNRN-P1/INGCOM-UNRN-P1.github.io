<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="650" height="420" viewBox="0 0 650 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #192437; text-anchor: middle; }
      .subtitle { font-family: 'Lato', Arial, sans-serif; font-size: 13px; fill: #555; text-anchor: middle; }
      .cell-char { fill: #e2eafc; stroke: #192437; stroke-width: 1.5; }
      .cell-int { fill: #fff0f2; stroke: #eb2141; stroke-width: 2; }
      .cell-short { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; }
      .cell-padding { fill: #e9ecef; stroke: #adb5bd; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .label-title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #192437; }
      .label-text { font-family: 'Lato', Arial, sans-serif; font-size: 12px; fill: #333; }
      .text-code { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #192437; }
      .mem-addr { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #666; text-anchor: middle; }
    </style>
  </defs>

  <!-- Fondo Blanco -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Títulos -->
  <text x="325" y="30" class="title">Alineamiento de Estructuras en Memoria (Padding)</text>
  <text x="325" y="50" class="subtitle">Disposición física de una estructura mixta en una arquitectura de 32/64 bits</text>

  <!-- Código del Struct de Ejemplo -->
  <g transform="translate(50, 90)">
    <rect width="200" height="150" fill="#f8f9fa" stroke="#ced4da" rx="4" />
    <text x="15" y="25" class="label-title">Definición en C</text>
    <text x="15" y="50" class="text-code" fill="#eb2141">struct mixto {</text>
    <text x="30" y="70" class="text-code">char a;      <tspan fill="#666">// 1 byte</tspan></text>
    <text x="30" y="90" class="text-code">int b;       <tspan fill="#666">// 4 bytes</tspan></text>
    <text x="30" y="110" class="text-code">short c;    <tspan fill="#666">// 2 bytes</tspan></text>
    <text x="15" y="135" class="text-code" fill="#eb2141">};</text>
  </g>

  <!-- Información de sizeof -->
  <g transform="translate(50, 260)">
    <rect width="200" height="90" fill="#e8f5e9" stroke="#2e7d32" rx="4" />
    <text x="15" y="25" class="label-title" fill="#2e7d32">Tamaño Real en RAM</text>
    <text x="15" y="50" class="text-code">sizeof(char) + ... = 7B</text>
    <text x="15" y="72" class="text-code" font-weight="bold">sizeof(struct mixto) = 12B</text>
  </g>

  <!-- Gráfico de Celdas Físicas de Memoria (12 Bytes contiguos) -->
  <g transform="translate(280, 110)">
    <text x="0" y="-15" class="label-title">Mapeo Byte a Byte en RAM</text>
    
    <!-- Dirección base 0x00 -->
    <!-- Byte 0: char a -->
    <rect x="0" y="0" width="40" height="60" class="cell-char" />
    <text x="20" y="35" class="text-code" text-anchor="middle">a</text>
    <text x="20" y="80" class="mem-addr">0x00</text>
    <text x="20" y="-2" class="label-text" text-anchor="middle" font-size="9" fill="#192437">char</text>

    <!-- Bytes 1-3: Padding -->
    <rect x="40" y="0" width="40" height="60" class="cell-padding" />
    <text x="60" y="35" class="text-code" fill="#888" text-anchor="middle">pad</text>
    <text x="60" y="80" class="mem-addr">0x01</text>
    
    <rect x="80" y="0" width="40" height="60" class="cell-padding" />
    <text x="100" y="35" class="text-code" fill="#888" text-anchor="middle">pad</text>
    <text x="100" y="80" class="mem-addr">0x02</text>

    <rect x="120" y="0" width="40" height="60" class="cell-padding" />
    <text x="140" y="35" class="text-code" fill="#888" text-anchor="middle">pad</text>
    <text x="140" y="80" class="mem-addr">0x03</text>

    <!-- Bytes 4-7: int b -->
    <rect x="160" y="0" width="40" height="60" class="cell-int" />
    <text x="180" y="35" class="text-code" text-anchor="middle">b[0]</text>
    <text x="180" y="80" class="mem-addr">0x04</text>
    <text x="240" y="-2" class="label-text" text-anchor="middle" font-size="9" fill="#eb2141">int (alineado a 4 bytes)</text>

    <rect x="200" y="0" width="40" height="60" class="cell-int" />
    <text x="220" y="35" class="text-code" text-anchor="middle">b[1]</text>
    <text x="220" y="80" class="mem-addr">0x05</text>

    <rect x="240" y="0" width="40" height="60" class="cell-int" />
    <text x="260" y="35" class="text-code" text-anchor="middle">b[2]</text>
    <text x="260" y="80" class="mem-addr">0x06</text>

    <rect x="280" y="0" width="40" height="60" class="cell-int" />
    <text x="300" y="35" class="text-code" text-anchor="middle">b[3]</text>
    <text x="300" y="80" class="mem-addr">0x07</text>

    <!-- Bytes 8-9: short c -->
    <rect x="320" y="0" width="40" height="60" class="cell-short" />
    <text x="340" y="35" class="text-code" text-anchor="middle">c[0]</text>
    <text x="340" y="80" class="mem-addr">0x08</text>
    <text x="360" y="-2" class="label-text" text-anchor="middle" font-size="9" fill="#2e7d32">short</text>

    <rect x="360" y="0" width="40" height="60" class="cell-short" />
    <text x="380" y="35" class="text-code" text-anchor="middle">c[1]</text>
    <text x="380" y="80" class="mem-addr">0x09</text>

    <!-- Bytes 10-11: Padding final (para alinear el tamaño total de la struct) -->
    <rect x="400" y="0" width="40" height="60" class="cell-padding" />
    <text x="420" y="35" class="text-code" fill="#888" text-anchor="middle">pad</text>
    <text x="420" y="80" class="mem-addr">0x0A</text>

    <rect x="440" y="0" width="40" height="60" class="cell-padding" />
    <text x="460" y="35" class="text-code" fill="#888" text-anchor="middle">pad</text>
    <text x="460" y="80" class="mem-addr">0x0B</text>
  </g>

  <!-- Explicación de alineación de palabras -->
  <g transform="translate(280, 240)">
    <rect width="320" height="110" fill="#f1f3f5" stroke="#ced4da" rx="4" />
    <text x="15" y="25" class="label-title">¿Por qué el compilador añade "pad"?</text>
    <text x="15" y="50" class="label-text">
      1. La CPU lee de la memoria física en palabras de 4 u 8 bytes.
    </text>
    <text x="15" y="70" class="label-text">
      2. Leer datos desalineados (ej. int b en 0x01) requeriría dos ciclos
    </text>
    <text x="15" y="90" class="label-text">
      de bus en lugar de uno, degradando la performance.
    </text>
  </g>

</svg>
