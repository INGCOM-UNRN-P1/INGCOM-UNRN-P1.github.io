name: CI Verificación de Ejercicios y Calidad Editorial

on:
  push:
    branches: [main]
    paths:
      - 'ejercicios/**'
      - '.github/workflows/ci-ejercicios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ejercicios/**'
      - '.github/workflows/ci-ejercicios.yml'

concurrency:
  group: ci-ejercicios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad-y-compilacion:
    name: Compuerta de Calidad C11 y Sintaxis MyST
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libasan8 libubsan1

      - name: Compuerta 1 - Auditoría Estática de Calidad Editorial
        run: node ejercicios/verificar_calidad.mjs

      - name: Compuerta 2 - Compilación y Aserciones C11 (Archivos Certificados)
        run: |
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_1_fundamentos/2_gradual_ejercicios.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_1_fundamentos/6_funciones_ejercicios.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_2_memoria/1_punteros.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_2_memoria/1b_punteros_ejercicios.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_2_memoria/3b_ejercicios_archivos.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_2_memoria/4c_ejercicios_memoria.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_2_memoria/6_structs.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_2_memoria/7_alias_tipos_ejercicios.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_3_algoritmos_estructuras/2_tad.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_3_algoritmos_estructuras/3_estructuras_de_datos.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_3_algoritmos_estructuras/5_recursion.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_4_avanzados/1_punteros_avanzados.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_4_avanzados/2_operaciones_de_bits.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_4_avanzados/3_archivos_binarios.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_4_avanzados/4_recursividad_avanzada.md
          node ejercicios/verificar_ejercicios.mjs ejercicios/bloque_4_avanzados/5_ordenamiento_y_busqueda.md
